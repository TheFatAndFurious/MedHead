name: medhead-performance

# Explicit resources so that "per instance" is measurable: one API instance limited to
# 2 CPUs and 1 GiB. The other containers are limited too, so that the remaining host
# cores stay available to k6, which runs on the host. Documented in tests/performance/README.md.
services:
  identity-database:
    extends:
      file: docker-compose.yaml
      service: identity-database
    cpus: 0.5
    mem_limit: 256m

  keycloak:
    extends:
      file: docker-compose.yaml
      service: keycloak
    environment:
      KC_HOSTNAME: http://localhost:58180
      KEYCLOAK_PERFORMANCE_SECRET: medhead_perf_only
    ports: !override
      - "127.0.0.1:58180:8080"
    volumes: !override
      - ./tests/performance/keycloak:/opt/keycloak/data/import:ro
    # Keycloak only issues one token and its JWKS during a campaign.
    cpus: 1
    mem_limit: 1g

  database:
    extends:
      file: docker-compose.yaml
      service: database
    environment:
      POSTGRES_DB: hospital_performance
      POSTGRES_USER: hospital_perf
      POSTGRES_PASSWORD: hospital_perf
    ports: !override []
    # Reference: 2 CPUs. PERF_DATABASE_CPUS raises it to check whether the API itself holds
    # the load once the database is no longer the bottleneck.
    # Same settings as the image, plus the WAL write and fsync timings (pg_stat_wal) read by
    # tests/performance/io_usage.py.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - track_wal_io_timing=on
    cpus: ${PERF_DATABASE_CPUS:-2}
    mem_limit: 2g

  database-tls:
    extends:
      file: docker-compose.yaml
      service: database-tls

  redis-tls:
    extends:
      file: docker-compose.yaml
      service: redis-tls

  redis:
    extends:
      file: docker-compose.yaml
      service: redis
    environment:
      REDIS_PASSWORD: medhead_perf
    cpus: 1
    mem_limit: 512m

  event-consumer:
    extends:
      file: docker-compose.yaml
      service: event-consumer
    environment:
      REDIS_PASSWORD: medhead_perf
      # One summary line every 10 s instead of one line per event.
      CONSUMER_LOG_EVENTS: "false"
    cpus: 0.5
    mem_limit: 128m

  api:
    extends:
      file: docker-compose.yaml
      service: api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/hospital_performance?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt
      SPRING_DATASOURCE_USERNAME: hospital_perf
      SPRING_DATASOURCE_PASSWORD: hospital_perf
      REDIS_PASSWORD: medhead_perf
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      KEYCLOAK_ISSUER_URI: http://localhost:58180/realms/medhead
      # Heap up to 75 % of the container memory (the JVM default is 25 %).
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports: !override
      - "127.0.0.1:58080:8080"
    # The single API instance measured against "800 req/s per instance".
    cpus: 2
    mem_limit: 1g

volumes:
  keycloak-data:
  postgis-data:
  postgis-tls:
  postgis-ca:
  redis-data:
  redis-tls:
  redis-ca:

networks:
  backend:
