bind 0.0.0.0
protected-mode yes

# Accept RESP over TLS only. Password authentication is set by start-redis.sh.
port 0
tls-port 6379
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

dir /data
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 300 1

# Reject writes when memory is full instead of evicting the event stream.
maxmemory-policy noeviction
