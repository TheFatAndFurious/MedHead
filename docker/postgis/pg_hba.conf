# TYPE     DATABASE  USER  ADDRESS  METHOD

# Unix socket inside the container: initialisation scripts, pg_isready and
# `docker compose exec database psql`. Not reachable from the network.
local      all       all            trust

# Network connections: TLS is mandatory, then SCRAM-SHA-256 authentication.
hostssl    all       all   all      scram-sha-256
hostnossl  all       all   all      reject
