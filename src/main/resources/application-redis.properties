spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:medhead_redis}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=redis
spring.ssl.bundle.pem.redis.truststore.certificate=${REDIS_CA_CERT:file:./.local/redis/ca.crt}

medhead.outbox.enabled=${MEDHEAD_OUTBOX_ENABLED:true}
management.health.redis.enabled=true
