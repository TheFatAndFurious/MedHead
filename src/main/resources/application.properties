spring.application.name=medhead

# The public issuer must match the token exactly; the JWKS URL may use Docker DNS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/medhead}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/medhead/protocol/openid-connect/certs}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospital}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hospital_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hospital_app}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

spring.data.redis.repositories.enabled=false

medhead.events.stream.key=${MEDHEAD_EVENTS_STREAM_KEY:medhead:reservations}
medhead.events.stream.max-length=${MEDHEAD_EVENTS_STREAM_MAX_LENGTH:10000}
medhead.events.stream.consumer-groups=${MEDHEAD_EVENTS_STREAM_CONSUMER_GROUPS:reservation-consumers}

# Enable the redis profile to connect with TLS and publish the outbox.
medhead.outbox.enabled=false
medhead.outbox.retry-delay=${MEDHEAD_OUTBOX_RETRY_DELAY:1000}
medhead.outbox.batch-size=${MEDHEAD_OUTBOX_BATCH_SIZE:100}
management.health.redis.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
