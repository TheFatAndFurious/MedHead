name: Backend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and build the front-end
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run check
          npm run build
      - name: Build the front-end Docker images
        run: |
          docker build --target runtime --tag medhead-frontend:ci frontend
          docker build --target dev --tag medhead-frontend:ci-dev frontend

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: medhead-ci-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 and the Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Start PostGIS TLS and Redis TLS
        run: docker compose -f docker-compose.test.yaml up --build -d --wait --wait-timeout 120

      - name: Copy the PostgreSQL and Redis CA certificates
        run: |
          mkdir -p .local/postgres-tests .local/redis-tests
          docker compose -f docker-compose.test.yaml cp \
            database:/tls/ca.crt .local/postgres-tests/ca.crt
          docker compose -f docker-compose.test.yaml cp \
            redis:/tls/ca.crt .local/redis-tests/ca.crt

      - name: Run all tests and package the application
        id: maven
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmedhead.integration-tests=true \
            -Dmedhead.redis-integration-tests=true \
            clean verify

      - name: Verify that all integration suites ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path("target/surefire-reports")
          required_suites = (
              "com.example.medhead.DatabaseTlsIntegrationTest",
              "com.example.medhead.hospital.api.HospitalCatalogIntegrationTest",
              "com.example.medhead.hospital.application.BedReservationIntegrationTest",
              "com.example.medhead.outbox.OutboxPublicationIntegrationTest",
              "com.example.medhead.acceptance.EmergencyInterventionAcceptanceTest",
          )
          for name in required_suites:
              report = reports / f"TEST-{name}.xml"
              if not report.is_file():
                  raise SystemExit(f"Missing integration test report: {report}")
              suite = ET.parse(report).getroot()
              tests = int(suite.get("tests", "0"))
              skipped = int(suite.get("skipped", "0"))
              failures = int(suite.get("failures", "0"))
              errors = int(suite.get("errors", "0"))
              if tests <= 0 or skipped or failures or errors:
                  raise SystemExit(
                      f"Integration suite {name}: tests={tests}, skipped={skipped}, "
                      f"failures={failures}, errors={errors}; expected successful, "
                      "non-skipped tests"
                  )
              print(f"{name}: {tests} tests passed, none skipped")
          PY

      - name: Build the Docker image
        run: docker build --tag medhead:ci .

      - name: Upload test reports
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the Cucumber acceptance report
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-acceptance-report-${{ github.sha }}
          path: target/cucumber-report.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the application JAR
        if: ${{ always() && steps.maven.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Collect Docker diagnostics on failure
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        run: |
          mkdir -p .local/ci-diagnostics
          docker compose -f docker-compose.test.yaml ps --all \
            > .local/ci-diagnostics/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.test.yaml logs --no-color \
            > .local/ci-diagnostics/compose-logs.txt 2>&1 || true

      - name: Upload Docker diagnostics
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-docker-diagnostics
          path: .local/ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Stop the test environment
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: docker compose -f docker-compose.test.yaml down --volumes --remove-orphans

  # Continuous delivery: pushes both images to GHCR once the CI jobs pass,
  # on a push to master or on a vX.Y.Z tag, never for a pull request.
  publish:
    name: publish (${{ matrix.image }})
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: medhead-api
            context: .
          - image: medhead-frontend
            context: frontend
            target: runtime
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute the version and the build date
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # master: sha-<7 characters> and master; vX.Y.Z tag: X.Y.Z and latest.
      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/thefatandfurious/${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build-date }}

  # Release: on a vX.Y.Z tag, once the images are published, builds the JAR with
  # version X.Y.Z and attaches it to a GitHub Release with generated notes.
  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      # The tests already passed in backend-ci for this commit.
      - name: Build the JAR with the tag version
        run: |
          ./mvnw --batch-mode --no-transfer-progress -DgenerateBackupPoms=false \
            versions:set -DnewVersion="${GITHUB_REF_NAME#v}"
          ./mvnw --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" target/*.jar --verify-tag --generate-notes
